name: Build Windows

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Popular catálogo a partir da planilha
        run: python -m app.importers.excel_importer "ELU Compressão.xlsx" catalogo.db

      - name: Empacotar com PyInstaller
        run: pyinstaller packaging/pyinstaller.spec --noconfirm

      - name: Incluir catálogo já populado no pacote
        run: Copy-Item catalogo.db dist/Dimensionamento/catalogo.db

      - name: Compactar
        run: Compress-Archive -Path dist/Dimensionamento/* -DestinationPath Dimensionamento-Windows.zip

      - name: Publicar artefato (execução manual)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: Dimensionamento-Windows
          path: Dimensionamento-Windows.zip

      - name: Publicar release (push de tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Dimensionamento-Windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
