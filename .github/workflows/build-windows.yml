name: Build Windows

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Testar interface e cálculos
        run: python -m pytest -q

      - name: Verificar versão
        run: |
          $version = python -c "from app import __version__; print(__version__)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($version -notmatch '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$') {
            throw "Versão inválida: $version"
          }
          if ($env:GITHUB_REF_TYPE -eq "tag" -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "A tag $env:GITHUB_REF_NAME não corresponde à versão v$version."
          }
          "PACKAGE_NAME=StructDim-v$version" >> $env:GITHUB_ENV

      - name: Popular catálogo a partir da planilha
        run: python -m app.importers.excel_importer "ELU Compressão.xlsx" catalogo.db

      - name: Empacotar com PyInstaller
        run: pyinstaller packaging/pyinstaller.spec --noconfirm

      - name: Incluir catálogo já populado no pacote
        run: Copy-Item catalogo.db dist/StructDim/catalogo.db

      - name: Compactar
        run: Compress-Archive -Path dist/StructDim/* -DestinationPath "$env:PACKAGE_NAME.zip"

      - name: Publicar artefato (execução manual)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE_NAME }}
          path: ${{ env.PACKAGE_NAME }}.zip

      - name: Publicar release (push de tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          body: "Aplicativo StructDim para Windows. Extraia todos os arquivos do ZIP antes de executar StructDim.exe."
          files: ${{ env.PACKAGE_NAME }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
