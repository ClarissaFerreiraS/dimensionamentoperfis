<svg xmlns="http://www.w3.org/2000/svg" width="1450" height="430" viewBox="0 0 1450 430" role="img" aria-labelledby="title desc">
  <title id="title">Fluxograma do StructDim</title>
  <desc id="desc">Visualização simples das ferramentas de desenvolvimento, importação do catálogo, interface, armazenamento e geração do relatório PDF.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4b5560"/></marker>
    <style>
      text { font-family: Arial, sans-serif; fill: #20252a; }
      .box { fill: #f1f1f1; stroke: #4b5560; stroke-width: 1.7; rx: 5; }
      .label { font-size: 16px; font-weight: 600; }
      .sub { font-size: 14px; fill: #434a52; }
      .arrow { fill: none; stroke: #4b5560; stroke-width: 1.7; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1450" height="430" fill="#ffffff"/>

  <rect class="box" x="22" y="168" width="155" height="60"/>
  <text class="label" x="99.5" y="192" text-anchor="middle">VS Code</text>
  <text class="sub" x="99.5" y="212" text-anchor="middle">Edição do código-fonte</text>

  <rect class="box" x="235" y="168" width="160" height="60"/>
  <text class="label" x="315" y="192" text-anchor="middle">Python</text>
  <text class="sub" x="315" y="212" text-anchor="middle">Linguagem e execução</text>
  <path class="arrow" d="M177 198 H225"/>

  <rect class="box" x="525" y="52" width="170" height="60"/>
  <text class="label" x="610" y="76" text-anchor="middle">PySide6</text>
  <text class="sub" x="610" y="96" text-anchor="middle">Interface gráfica</text>
  <path class="arrow" d="M395 182 C450 130 475 82 515 82"/>

  <rect class="box" x="850" y="168" width="235" height="60"/>
  <text class="label" x="967.5" y="192" text-anchor="middle">Aplicação StructDim</text>
  <text class="sub" x="967.5" y="212" text-anchor="middle">Dimensionamento de perfis</text>
  <path class="arrow" d="M695 82 C770 82 800 168 840 183"/>

  <rect class="box" x="525" y="168" width="170" height="60"/>
  <text class="label" x="610" y="192" text-anchor="middle">SQLite / sqlite3</text>
  <text class="sub" x="610" y="212" text-anchor="middle">Armazenamento</text>
  <path class="arrow" d="M395 198 H515"/>
  <path class="arrow" d="M850 190 H705"/>
  <path class="arrow" d="M705 207 H840"/>

  <rect class="box" x="235" y="320" width="160" height="60"/>
  <text class="label" x="315" y="344" text-anchor="middle">Planilha Excel</text>
  <text class="sub" x="315" y="364" text-anchor="middle">Catálogo de dados</text>

  <rect class="box" x="525" y="320" width="170" height="60"/>
  <text class="label" x="610" y="344" text-anchor="middle">openpyxl</text>
  <text class="sub" x="610" y="364" text-anchor="middle">Importação da planilha</text>
  <path class="arrow" d="M395 350 H515"/>
  <path class="arrow" d="M610 320 C610 278 610 255 610 238"/>

  <rect class="box" x="850" y="320" width="170" height="60"/>
  <text class="label" x="935" y="344" text-anchor="middle">fpdf2</text>
  <text class="sub" x="935" y="364" text-anchor="middle">Geração do memorial</text>
  <path class="arrow" d="M967 228 C967 264 935 280 935 310"/>

  <rect class="box" x="1160" y="320" width="245" height="60"/>
  <text class="label" x="1282.5" y="344" text-anchor="middle">Memorial de cálculo</text>
  <text class="sub" x="1282.5" y="364" text-anchor="middle">Arquivo PDF</text>
  <path class="arrow" d="M1020 350 H1150"/>
</svg>
